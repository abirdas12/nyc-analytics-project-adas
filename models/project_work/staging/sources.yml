version: 2
sources:
  - name: raw
    description: Raw data loaded from NYC Open Data
    database: das-project-cis9440-sp26
    schema: cis_9440_group_project

    tables:
      - name: source_nyc_motor_vehicle_collision
        description: |
          NYC motor vehicle collision data. 
          One row represent one collision reported.
        columns:
          - name: collision_id
            description: Unique ID for collision generated by the system.
            tests:
              - unique
              - not_null
          - name: crash_date
            description: Occurrence date of collision.
          - name: borough
            description: Borough where collision occurred.
          - name: zip_code
            description: Postal code of incident occurrence.
          - name: on_street_name
            description: Street on which the collision ocurred.
          - name: off_street_name
            description: Nearest cross street to the collosion.
          - name: cross_street_name
            description: Street address if known.
          - name: latitude
            description: Latitude coordinate for Global Coordinate System, WGS 1984, decimal degrees (EPSG 4326).
          - name: longitude
            description: Longitude coordinate for Global Coordinate System, WGS 1984, decimal degrees (EPSG 4326).
          - name: contributing_factor_vehicle_1
            description: Contributing factor for vehicle 1.
          - name: contributing_factor_vehicle_2
            description: Contributing factor for vehicle 2.
          - name: contributing_factor_vehicle_3
            description: Contributing factor for vehicle 3.
          - name: contributing_factor_vehicle_4
            description: Contributing factor for vehicle 4.
          - name: contributing_factor_vehicle_5
            description: Contributing factor for vehicle 5.
          - name: crash_time
            description: Time of crash occured.
          - name: number_of_cyclist_injured
            description: Count of cyclist injuries. 
          - name: number_of_cyclist_killed
            description: Count of cyclist killed. 
          - name: number_of_motorist_injured
            description: Count of motorist injuries. 
          - name: number_of_motorist_killed
            description: Count of motorist killed. 
          - name: number_of_pedestrians_injured
            description: Count of pedestrians injuries. 
          - name: number_of_pedestrians_killed
            description: Count of pedestrians killed.
          - name: number_of_persons_injured
            description: Count of persons injured.
          - name: number_of_persons_killed
            description: Count of persons killed.
          - name: vehicle_type_code1
            description: Vehicle type 1.
          - name: vehicle_type_code2
            description: Vehicle type 2.
          - name: vehicle_type_code_3
            description: Vehicle type 3.
          - name: vehicle_type_code_4
            description: Vehicle type 4.
          - name: vehicle_type_code_5
            description: Vehicle type 5.



